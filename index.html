<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>VO45 IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0d12; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; height: 100vh; }
    #sidebar { width: 420px; background: rgba(15, 18, 26, 0.95); border-right: 1px solid #222; display: flex; flex-direction: column; z-index: 10; transition: transform 0.25s; }
    #sidebar.hidden { transform: translateX(-100%); position: absolute; height: 100%; }
    #header { padding: 20px; font-size: 26px; font-weight: bold; border-bottom: 1px solid #222; }
    #header span.vo { color: #facc15; }
    #header span.num { color: #ef4444; }
    #list { flex: 1; overflow-y: auto; padding: 10px; }
    .item { display: flex; align-items: center; padding: 12px 14px; margin-bottom: 6px; border-radius: 8px; background: #151923; font-size: 18px; }
    .item.active { background: #2563eb; font-weight: bold; }
    .item img { width: 36px; height: 36px; object-fit: contain; margin-right: 12px; background: #000; border-radius: 4px; }
    #player-wrap { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: contain; }
    #osd { position: absolute; bottom: 30px; left: 30px; background: rgba(0,0,0,0.75); padding: 14px 22px; border-radius: 8px; font-size: 22px; display: none; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="header"><span class="vo">VO</span><span class="num">45</span> IPTV</div>
    <div id="list"></div>
  </div>
  <div id="player-wrap">
    <video id="video" autoplay playsinline></video>
    <div id="osd"></div>
  </div>

  <script>
    const M3U_URL = 'playlist.m3u'; // İstersen buraya GitHub Raw M3U linkini de yazabilirsin
    let channels = [];
    let selectedIndex = 0;
    let hls = null;

    const listEl = document.getElementById('list');
    const sidebarEl = document.getElementById('sidebar');
    const videoEl = document.getElementById('video');
    const osdEl = document.getElementById('osd');

    function parseM3U(text) {
      const lines = text.split(/\r?\n/);
      const result = [];
      let current = null;
      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('#EXTINF:')) {
          const logoMatch = trimmed.match(/tvg-logo="([^"]*)"/);
          const nameParts = trimmed.split(',');
          current = {
            name: nameParts[nameParts.length - 1].trim(),
            logo: logoMatch ? logoMatch[1] : ''
          };
        } else if (trimmed && !trimmed.startsWith('#') && current) {
          current.url = trimmed;
          result.push(current);
          current = null;
        }
      }
      return result;
    }

    function renderList() {
      listEl.innerHTML = '';
      channels.forEach((ch, idx) => {
        const div = document.createElement('div');
        div.className = 'item' + (idx === selectedIndex ? ' active' : '');
        div.innerHTML = (ch.logo ? `<img src="${ch.logo}" onerror="this.style.display='none'">` : '') + `<span>${idx + 1}. ${ch.name}</span>`;
        listEl.appendChild(div);
      });
      const activeEl = listEl.children[selectedIndex];
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
    }

    function showOSD(text) {
      osdEl.textContent = text;
      osdEl.style.display = 'block';
      clearTimeout(window.osdTimer);
      window.osdTimer = setTimeout(() => { osdEl.style.display = 'none'; }, 3500);
    }

    function playChannel(idx) {
      const ch = channels[idx];
      if (!ch) return;
      showOSD(`${idx + 1}. ${ch.name}`);
      if (hls) { hls.destroy(); hls = null; }

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(ch.url);
        hls.attachMedia(videoEl);
        hls.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            videoEl.src = ch.url;
            videoEl.play().catch(() => {});
          }
        });
      } else {
        videoEl.src = ch.url;
        videoEl.play().catch(() => {});
      }
    }

    document.addEventListener('keydown', (e) => {
      if (!channels.length) return;
      if (e.keyCode === 38) { // Yukarı
        selectedIndex = (selectedIndex - 1 + channels.length) % channels.length;
        renderList();
      } else if (e.keyCode === 40) { // Aşağı
        selectedIndex = (selectedIndex + 1) % channels.length;
        renderList();
      } else if (e.keyCode === 13) { // OK
        playChannel(selectedIndex);
        sidebarEl.classList.add('hidden');
      } else if (e.keyCode === 461 || e.keyCode === 27 || e.keyCode === 37) { // Geri / Sol
        sidebarEl.classList.toggle('hidden');
      }
    });

    fetch(M3U_URL)
      .then(r => r.text())
      .then(txt => {
        channels = parseM3U(txt);
        renderList();
        if (channels.length) playChannel(0);
      });
  </script>
</body>
</html>
