<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>VO45 IPTV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0d12; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; display: -webkit-flex; height: 100vh; }
    #sidebar { width: 420px; background: rgba(15, 18, 26, 0.95); border-right: 1px solid #222; display: flex; display: -webkit-flex; flex-direction: column; -webkit-flex-direction: column; z-index: 10; }
    #sidebar.hidden { display: none; }
    #header { padding: 20px; font-size: 26px; font-weight: bold; border-bottom: 1px solid #222; }
    #header span.vo { color: #facc15; }
    #header span.num { color: #ef4444; }
    #list { flex: 1; -webkit-flex: 1; overflow-y: auto; padding: 10px; }
    .item { display: flex; display: -webkit-flex; align-items: center; -webkit-align-items: center; padding: 12px 14px; margin-bottom: 6px; border-radius: 8px; background: #151923; font-size: 18px; cursor: pointer; }
    .item.active { background: #2563eb; font-weight: bold; }
    .item img { width: 36px; height: 36px; object-fit: contain; margin-right: 12px; background: #000; border-radius: 4px; }
    .status-msg { padding: 16px; color: #9ca3af; font-size: 16px; }
    #player-wrap { flex: 1; -webkit-flex: 1; position: relative; background: #000; display: flex; display: -webkit-flex; align-items: center; -webkit-align-items: center; justify-content: center; -webkit-justify-content: center; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #osd { position: absolute; top: 28px; right: 32px; width: 240px; height: 240px; background: rgba(11, 13, 18, 0.92); border: 2px solid #374151; padding: 16px; border-radius: 16px; font-size: 28px; font-weight: bold; color: #f9fafb; z-index: 30; line-height: 1.25; text-align: center; display: flex; display: -webkit-flex; flex-direction: column; -webkit-flex-direction: column; align-items: center; -webkit-align-items: center; justify-content: center; -webkit-justify-content: center; word-wrap: break-word; overflow: hidden; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7); }
    #osd img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 12px; border-radius: 8px; background: #000; }
    #osd .osd-name { font-size: 30px; line-height: 1.2; color: #fff; }
    #osd .osd-sub { font-size: 16px; color: #9ca3af; margin-top: 8px; font-weight: normal; }
    #num-box { position: absolute; top: 284px; right: 32px; width: 240px; text-align: center; background: rgba(15, 18, 26, 0.94); border: 2px solid #facc15; color: #facc15; font-size: 40px; font-weight: bold; padding: 10px 16px; border-radius: 12px; z-index: 40; display: none; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="header"><span class="vo">VO</span><span class="num">45</span> IPTV</div>
    <div id="list"><div class="status-msg">Kanal listesi yükleniyor...</div></div>
  </div>
  <div id="player-wrap">
    <video id="video" autoplay playsinline></video>
    <div id="osd">Başlatılıyor...</div>
    <div id="num-box"></div>
  </div>

  <script>
    var osdEl = document.getElementById('osd');
    var numBoxEl = document.getElementById('num-box');

    function showOSD(text, autoHide, chObj) {
      if (chObj) {
        var logoPart = chObj.logo ? '<img src="' + chObj.logo + '" onerror="this.style.display=\'none\'">' : '';
        var subPart = text ? '<div class="osd-sub">' + text + '</div>' : '';
        osdEl.innerHTML = logoPart +
          '<div class="osd-name">' + chObj.name + '</div>' +
          subPart;
      } else {
        osdEl.textContent = text;
      }
      osdEl.style.display = 'flex';
      osdEl.style.display = '-webkit-flex';
      clearTimeout(window.osdTimer);
      if (autoHide) {
        window.osdTimer = setTimeout(function() {
          osdEl.style.display = 'none';
        }, 4000);
      }
    }

    var REMOTE_M3U_URL = 'https://raw.githubusercontent.com/nistelrooy61/VO45-webOS/main/playlist.m3u';
    var LOCAL_M3U_URL = 'playlist.m3u';
    var TV_WORKER_HOST = 'http://vo45tv.dpdns.org';
    var channels = [];
    var selectedIndex = 0;
    var playingIndex = -1;
    var currentMode = 'ts';
    var currentTargetUrl = '';
    var retryCount = 0;
    var digitBuffer = '';
    var digitTimer = null;
    var connectTimer = null;
    var frameCheckTimer = null;
    var streamStarted = false;

    var listEl = document.getElementById('list');
    var sidebarEl = document.getElementById('sidebar');
    var videoEl = document.getElementById('video');

    function trimStr(str) {
      return str.replace(/^\s+|\s+$/g, '');
    }

    function extractTargetParam(rawUrl) {
      var m = rawUrl.match(/[?&]url=([^&]+)/);
      if (m) return decodeURIComponent(m[1]);
      return rawUrl;
    }

    function buildTvUrl(rawUrl, ext) {
      if (rawUrl.indexOf('workers.dev') !== -1 || rawUrl.indexOf('vo45tv.dpdns.org') !== -1 || rawUrl.indexOf('vavoo.to') !== -1 || rawUrl.indexOf('kool.to') !== -1) {
        var target = extractTargetParam(rawUrl);
        return TV_WORKER_HOST + '/live.' + ext + '?url=' + encodeURIComponent(target);
      }
      return rawUrl;
    }

    function parseM3U(text) {
      var lines = text.split(/\r?\n/);
      var result = [];
      var current = null;
      for (var i = 0; i < lines.length; i++) {
        var trimmed = trimStr(lines[i]);
        if (trimmed.indexOf('#EXTINF:') === 0) {
          var logoMatch = trimmed.match(/tvg-logo="([^"]*)"/);
          var nameParts = trimmed.split(',');
          current = {
            name: trimStr(nameParts[nameParts.length - 1]),
            logo: logoMatch ? logoMatch[1] : ''
          };
        } else if (trimmed && trimmed.indexOf('#') !== 0 && current) {
          current.url = trimmed;
          result.push(current);
          current = null;
        }
      }
      return result;
    }

    function renderList() {
      listEl.innerHTML = '';
      if (!channels.length) {
        listEl.innerHTML = '<div class="status-msg">Kanal bulunamadı.</div>';
        return;
      }
      for (var i = 0; i < channels.length; i++) {
        (function(idx) {
          var ch = channels[idx];
          var div = document.createElement('div');
          div.className = 'item' + (idx === selectedIndex ? ' active' : '');
          var logoHtml = ch.logo ? '<img src="' + ch.logo + '" onerror="this.style.display=\'none\'">' : '';
          div.innerHTML = logoHtml + '<span>' + (idx + 1) + '. ' + ch.name + '</span>';
          div.onclick = function() {
            selectedIndex = idx;
            renderList();
            playChannel(idx, true);
            sidebarEl.className = 'hidden';
          };
          listEl.appendChild(div);
        })(i);
      }
      var activeEl = listEl.children[selectedIndex];
      if (activeEl && activeEl.scrollIntoView) {
        activeEl.scrollIntoView(false);
      }
    }

    function hasVideoFrame() {
      return videoEl.videoWidth > 0 || videoEl.readyState >= 2 || videoEl.currentTime > 0;
    }

    function markStreamPlaying() {
      if (streamStarted) return;
      streamStarted = true;
      clearTimeout(connectTimer);
      clearInterval(frameCheckTimer);
      retryCount = 0;
      var ch = channels[playingIndex];
      showOSD('', true, ch);
    }

    function handleStreamFailure(code) {
      if (streamStarted || hasVideoFrame()) {
        markStreamPlaying();
        return;
      }
      clearTimeout(connectTimer);
      clearInterval(frameCheckTimer);
      var ch = channels[playingIndex];

      if (currentMode === 'ts') {
        currentMode = 'm3u8';
        var m3uUrl = buildTvUrl(currentTargetUrl, 'm3u8');
        showOSD('HLS deneniyor...', true, ch);
        startStream(m3uUrl, 'application/vnd.apple.mpegurl');
      } else if (retryCount < 1) {
        retryCount++;
        showOSD('Yeniden bağlanıyor...', true, ch);
        setTimeout(function() {
          playChannel(playingIndex, false);
        }, 1500);
      } else {
        showOSD('Yayın açılamadı (' + code + ')', true, ch);
      }
    }

    function startStream(url, mimeType) {
      clearTimeout(connectTimer);
      clearInterval(frameCheckTimer);
      streamStarted = false;
      videoEl.pause();
      videoEl.innerHTML = '';
      videoEl.removeAttribute('src');
      videoEl.load();

      var srcEl = document.createElement('source');
      srcEl.src = url;
      if (mimeType) srcEl.type = mimeType;
      videoEl.appendChild(srcEl);
      videoEl.load();

      var p = videoEl.play();
      if (p && typeof p.catch === 'function') p.catch(function() {});

      frameCheckTimer = setInterval(function() {
        if (hasVideoFrame()) {
          markStreamPlaying();
        }
      }, 400);

      connectTimer = setTimeout(function() {
        if (!streamStarted) {
          if (hasVideoFrame()) {
            markStreamPlaying();
          } else {
            handleStreamFailure('Zaman aşımı');
          }
        }
      }, 10000);
    }

    videoEl.onloadeddata = markStreamPlaying;
    videoEl.oncanplay = markStreamPlaying;
    videoEl.onplaying = markStreamPlaying;
    videoEl.ontimeupdate = function() {
      if (hasVideoFrame()) {
        markStreamPlaying();
      }
    };

    videoEl.onerror = function() {
      if (streamStarted) return;
      var code = videoEl.error ? videoEl.error.code : '?';
      handleStreamFailure('Kod: ' + code);
    };

    function playChannel(idx, resetRetry) {
      var ch = channels[idx];
      if (!ch) return;
      if (resetRetry) retryCount = 0;
      playingIndex = idx;
      selectedIndex = idx;
      renderList();

      currentTargetUrl = ch.url;
      currentMode = 'ts';
      var tsUrl = buildTvUrl(ch.url, 'ts');
      showOSD('Bağlanıyor...', true, ch);
      startStream(tsUrl, 'video/mp2t;mediaOption=' + encodeURIComponent(JSON.stringify({ mediaTransportType: 'RAW' })));
    }

    function stepChannel(delta) {
      if (!channels.length) return;
      var base = (playingIndex >= 0) ? playingIndex : selectedIndex;
      var next = (base + delta + channels.length) % channels.length;
      playChannel(next, true);
    }

    function commitDigitJump() {
      clearTimeout(digitTimer);
      numBoxEl.style.display = 'none';
      if (!digitBuffer) return;
      var num = parseInt(digitBuffer, 10);
      digitBuffer = '';
      if (num >= 1 && num <= channels.length) {
        playChannel(num - 1, true);
        sidebarEl.className = 'hidden';
      } else {
        showOSD('Geçersiz kanal: ' + num, true);
      }
    }

    function handleDigit(digit) {
      if (digitBuffer.length >= 4) digitBuffer = '';
      digitBuffer += digit;
      numBoxEl.textContent = digitBuffer;
      numBoxEl.style.display = 'block';
      clearTimeout(digitTimer);
      digitTimer = setTimeout(commitDigitJump, 1500);
    }

    function loadPlaylist(url, isFallback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url + (url.indexOf('http') === 0 ? '?t=' + new Date().getTime() : ''), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if ((xhr.status >= 200 && xhr.status < 300) || (xhr.status === 0 && xhr.responseText)) {
            channels = parseM3U(xhr.responseText);
            renderList();
            if (channels.length) {
              playChannel(0, true);
            }
          } else if (!isFallback) {
            loadPlaylist(LOCAL_M3U_URL, true);
          }
        }
      };
      xhr.onerror = function() {
        if (!isFallback) loadPlaylist(LOCAL_M3U_URL, true);
      };
      xhr.send();
    }

    document.addEventListener('keydown', function(e) {
      var code = e.keyCode || e.which;
      if (!channels.length) return;
      var isMenuHidden = (sidebarEl.className === 'hidden');

      if (code >= 48 && code <= 57) {
        handleDigit(String(code - 48));
        return;
      }

      if (code === 33) {
        stepChannel(1);
        return;
      }
      if (code === 34) {
        stepChannel(-1);
        return;
      }

      if (code === 38) {
        if (isMenuHidden) {
          stepChannel(1);
        } else {
          selectedIndex = (selectedIndex - 1 + channels.length) % channels.length;
          renderList();
        }
        return;
      }
      if (code === 40) {
        if (isMenuHidden) {
          stepChannel(-1);
        } else {
          selectedIndex = (selectedIndex + 1) % channels.length;
          renderList();
        }
        return;
      }

      if (code === 13) {
        if (digitBuffer) {
          commitDigitJump();
        } else if (isMenuHidden) {
          sidebarEl.className = '';
          renderList();
        } else {
          playChannel(selectedIndex, true);
          sidebarEl.className = 'hidden';
        }
        return;
      }

      if (code === 37 || code === 39 || code === 461 || code === 27) {
        sidebarEl.className = isMenuHidden ? '' : 'hidden';
        if (!isMenuHidden) renderList();
      }
    });

    loadPlaylist(REMOTE_M3U_URL, false);
  </script>
</body>
</html>
