<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>VO45 IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0d12; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; display: -webkit-flex; height: 100vh; }
    #sidebar { width: 420px; background: rgba(15, 18, 26, 0.95); border-right: 1px solid #222; display: flex; display: -webkit-flex; flex-direction: column; -webkit-flex-direction: column; z-index: 10; }
    #sidebar.hidden { display: none; }
    #header { padding: 20px; font-size: 26px; font-weight: bold; border-bottom: 1px solid #222; }
    #header span.vo { color: #facc15; }
    #header span.num { color: #ef4444; }
    #list { flex: 1; -webkit-flex: 1; overflow-y: auto; padding: 10px; }
    .item { display: flex; display: -webkit-flex; align-items: center; -webkit-align-items: center; padding: 12px 14px; margin-bottom: 6px; border-radius: 8px; background: #151923; font-size: 18px; cursor: pointer; }
    .item.active { background: #2563eb; font-weight: bold; }
    .item img { width: 36px; height: 36px; object-fit: contain; margin-right: 12px; background: #000; border-radius: 4px; }
    .status-msg { padding: 16px; color: #9ca3af; font-size: 16px; }
    #player-wrap { flex: 1; -webkit-flex: 1; position: relative; background: #000; display: flex; display: -webkit-flex; align-items: center; -webkit-align-items: center; justify-content: center; -webkit-justify-content: center; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #osd { position: absolute; bottom: 25px; left: 25px; right: 25px; background: rgba(0, 0, 0, 0.88); border: 1px solid #333; padding: 14px 20px; border-radius: 8px; font-size: 18px; color: #f3f4f6; z-index: 30; line-height: 1.4; word-break: break-all; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="header"><span class="vo">VO</span><span class="num">45</span> IPTV</div>
    <div id="list"><div class="status-msg">Kanal listesi yükleniyor...</div></div>
  </div>
  <div id="player-wrap">
    <video id="video" autoplay playsinline></video>
    <div id="osd">Başlatılıyor...</div>
  </div>

  <script>
    var osdEl = document.getElementById('osd');
    function showOSD(text, autoHide) {
      osdEl.textContent = text;
      osdEl.style.display = 'block';
      clearTimeout(window.osdTimer);
      if (autoHide) {
        window.osdTimer = setTimeout(function() {
          osdEl.style.display = 'none';
        }, 4000);
      }
    }

    var REMOTE_M3U_URL = 'https://raw.githubusercontent.com/nistelrooy61/VO45-webOS/main/playlist.m3u';
    var LOCAL_M3U_URL = 'playlist.m3u';
    var channels = [];
    var selectedIndex = 0;
    var hls = null;

    var listEl = document.getElementById('list');
    var sidebarEl = document.getElementById('sidebar');
    var videoEl = document.getElementById('video');

    function trimStr(str) {
      return str.replace(/^\s+|\s+$/g, '');
    }

    function prepareTvUrl(rawUrl) {
      if (rawUrl.indexOf('vavoo-resolver') !== -1 && rawUrl.indexOf('tv=1') === -1) {
        return rawUrl + (rawUrl.indexOf('?') !== -1 ? '&tv=1' : '?tv=1');
      }
      return rawUrl;
    }

    function parseM3U(text) {
      var lines = text.split(/\r?\n/);
      var result = [];
      var current = null;
      for (var i = 0; i < lines.length; i++) {
        var trimmed = trimStr(lines[i]);
        if (trimmed.indexOf('#EXTINF:') === 0) {
          var logoMatch = trimmed.match(/tvg-logo="([^"]*)"/);
          var nameParts = trimmed.split(',');
          current = {
            name: trimStr(nameParts[nameParts.length - 1]),
            logo: logoMatch ? logoMatch[1] : ''
          };
        } else if (trimmed && trimmed.indexOf('#') !== 0 && current) {
          current.url = trimmed;
          result.push(current);
          current = null;
        }
      }
      return result;
    }

    function renderList() {
      listEl.innerHTML = '';
      if (!channels.length) {
        listEl.innerHTML = '<div class="status-msg">Kanal bulunamadı.</div>';
        return;
      }
      for (var i = 0; i < channels.length; i++) {
        (function(idx) {
          var ch = channels[idx];
          var div = document.createElement('div');
          div.className = 'item' + (idx === selectedIndex ? ' active' : '');
          var logoHtml = ch.logo ? '<img src="' + ch.logo + '" onerror="this.style.display=\'none\'">' : '';
          div.innerHTML = logoHtml + '<span>' + (idx + 1) + '. ' + ch.name + '</span>';
          div.onclick = function() {
            selectedIndex = idx;
            renderList();
            playChannel(idx);
            sidebarEl.className = 'hidden';
          };
          listEl.appendChild(div);
        })(i);
      }
      var activeEl = listEl.children[selectedIndex];
      if (activeEl && activeEl.scrollIntoView) {
        activeEl.scrollIntoView(false);
      }
    }

    function resetVideo() {
      if (hls) {
        try { hls.destroy(); } catch (e) {}
        hls = null;
      }
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
    }

    function playNative(url, label) {
      resetVideo();
      videoEl.src = url;
      videoEl.load();
      var p = videoEl.play();
      if (p && typeof p.catch === 'function') p.catch(function() {});
    }

    videoEl.onplaying = function() {
      var ch = channels[selectedIndex];
      showOSD((selectedIndex + 1) + '. ' + (ch ? ch.name : ''), true);
    };

    videoEl.onerror = function() {
      var code = videoEl.error ? videoEl.error.code : '?';
      showOSD('Oynatma Hatası (Kod: ' + code + ')', false);
    };

    function playChannel(idx) {
      var ch = channels[idx];
      if (!ch) return;
      var streamUrl = prepareTvUrl(ch.url);
      var label = (idx + 1) + '. ' + ch.name;
      showOSD(label + ' yükleniyor...', false);

      resetVideo();

      if (typeof Hls !== 'undefined' && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: false,
          maxBufferLength: 15,
          manifestLoadingTimeOut: 15000,
          levelLoadingTimeOut: 15000
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(videoEl);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          var p = videoEl.play();
          if (p && typeof p.catch === 'function') p.catch(function() {});
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data && data.fatal) {
            var status = (data.response && data.response.code) ? ' HTTP:' + data.response.code : '';
            showOSD(label + ' - HLS Hatası: ' + data.details + status, false);
            if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            } else {
              playNative(streamUrl, label);
            }
          }
        });
      } else {
        playNative(streamUrl, label);
      }
    }

    function loadPlaylist(url, isFallback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url + (url.indexOf('http') === 0 ? '?t=' + new Date().getTime() : ''), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if ((xhr.status >= 200 && xhr.status < 300) || (xhr.status === 0 && xhr.responseText)) {
            channels = parseM3U(xhr.responseText);
            renderList();
            if (channels.length) {
              playChannel(0);
            }
          } else if (!isFallback) {
            loadPlaylist(LOCAL_M3U_URL, true);
          }
        }
      };
      xhr.onerror = function() {
        if (!isFallback) loadPlaylist(LOCAL_M3U_URL, true);
      };
      xhr.send();
    }

    document.addEventListener('keydown', function(e) {
      var code = e.keyCode || e.which;
      if (!channels.length) return;

      if (code === 38) {
        selectedIndex = (selectedIndex - 1 + channels.length) % channels.length;
        renderList();
      } else if (code === 40) {
        selectedIndex = (selectedIndex + 1) % channels.length;
        renderList();
      } else if (code === 13) {
        playChannel(selectedIndex);
        sidebarEl.className = 'hidden';
      } else if (code === 461 || code === 27 || code === 37) {
        sidebarEl.className = (sidebarEl.className === 'hidden') ? '' : 'hidden';
      }
    });

    loadPlaylist(REMOTE_M3U_URL, false);
  </script>
</body>
</html>
