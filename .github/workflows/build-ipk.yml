name: Build webOS IPK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate IPTV Icons
        run: |
          convert -size 72x72 xc:"#0b0d12" -bordercolor "#ef4444" -border 4 -gravity center -fill "#facc15" -pointsize 24 -annotate +0+0 "IPTV" PNG32:icon.png
          convert -size 118x118 xc:"#0b0d12" -bordercolor "#ef4444" -border 6 -gravity center -fill "#facc15" -pointsize 38 -annotate +0+0 "IPTV" PNG32:largeIcon.png

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Package IPK
        run: |
          mkdir -p dist
          ares-package . -o dist --no-minify

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vo45-webos-ipk
          path: dist/*.ipk
          
