name: Build webOS IPK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Valid PNG Icons
        run: |
          python3 -c "
          import zlib, struct
          def make_png(w, h, filename):
              raw = b''
              for y in range(h):
                  row = bytearray([0])
                  for x in range(w):
                      if x < 4 or x >= w-4 or y < 4 or y >= h-4:
                          row.extend([239, 68, 68, 255])
                      else:
                          row.extend([250, 204, 21, 255])
                  raw += bytes(row)
              def chunk(tag, data):
                  return struct.pack('!I', len(data)) + tag + data + struct.pack('!I', zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack('!IIBBBBB', w, h, 8, 6, 0, 0, 0)
              with open(filename, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b''))
          make_png(80, 80, 'icon.png')
          make_png(130, 130, 'largeIcon.png')
          "

      - name: Install webOS CLI
        run: npm install -g @webosose/ares-cli || npm install -g @webos-tools/cli

      - name: Package IPK
        run: |
          mkdir -p dist
          ares-package . -o dist --no-minify

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vo45-webos-ipk
          path: dist/*.ipk
          
